name: skin_capture
description: iOS 與 Android 肌膚相機拍攝引導，提供原生 UI、自動拍照與 JPEG 回傳。
version: 0.2.0
publish_to: none
repository: https://github.com/JoJoe5/skin-capture-ios-public
environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.47.6'
dependencies:
  flutter:
    sdk: flutter
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  plugin:
    platforms:
      android:
        package: com.skincapture.skin_capture
        pluginClass: SkinCapturePlugin
      ios:
        pluginClass: SkinCapturePlugin
