name: SkinCaptureSDK
options:
  bundleIdPrefix: com.skincapture
  deploymentTarget:
    iOS: '16.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    IPHONEOS_DEPLOYMENT_TARGET: '16.0'
    CODE_SIGNING_ALLOWED: NO
    TARGETED_DEVICE_FAMILY: '1'
targets:
  SkinCaptureSDK:
    type: framework
    platform: iOS
    sources:
      - path: ios/skin_capture/Sources/SkinCaptureSDK
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.skincapture.sdk
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: NO
        BUILD_LIBRARY_FOR_DISTRIBUTION: YES
    scheme:
      testTargets:
        - SkinCaptureSDKTests
  SkinCaptureSDKTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/SkinCaptureSDKTests
    dependencies:
      - target: SkinCaptureSDK
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.skincapture.sdk.tests
